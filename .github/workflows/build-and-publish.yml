name: Build and Publish IPTV

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/build-and-publish.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Detect Pages URL
        id: pages
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          echo "epg_url=https://${OWNER}.github.io/${REPO}/epg_hispanohablante.xml.gz" >> "$GITHUB_OUTPUT"
          echo "m3u_url=https://${OWNER}.github.io/${REPO}/lista_tivimate.m3u" >> "$GITHUB_OUTPUT"

      - name: Generate playlist + EPG
        run: python main.py --epg-url "${{ steps.pages.outputs.epg_url }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
