name: Build and Publish IPTV

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Regenerar lista en el runner (puede fallar streams LATAM por geo)"
        type: boolean
        default: false
      health_check:
        description: "Aplicar health-check en el runner"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "published/**"
      - ".github/workflows/build-and-publish.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.event_name == 'workflow_dispatch' && inputs.rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate
        run: |
          EPG="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/epg_hispanohablante.xml.gz"
          if [ "${{ inputs.health_check }}" = "true" ]; then
            python main.py --epg-url "$EPG" --health-check
          else
            python main.py --epg-url "$EPG"
          fi
          mkdir -p published
          cp -f dist/lista_tivimate.m3u dist/epg_hispanohablante.xml.gz published/
          if [ -f dist/health_report.html ]; then cp -f dist/health_report.html dist/health_report.json published/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: published-rebuild
          path: published

  deploy:
    runs-on: ubuntu-latest
    needs: [rebuild]
    if: always() && (needs.rebuild.result == 'success' || needs.rebuild.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Use rebuilt artifact if present
        if: needs.rebuild.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: published-rebuild
          path: published

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: published

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
